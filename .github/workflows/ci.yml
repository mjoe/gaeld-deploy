name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck -S warning -s sh scripts/*.sh docker/entrypoint.sh
      - name: actionlint (workflows)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest
      - name: Hadolint (Dockerfile)
        run: docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < Dockerfile
      - name: Check that the upstream version is consistent
        run: ./scripts/check-versions.sh
      - name: Validate compose file
        run: |
          ./scripts/init.sh .env.ci
          ENV_FILE=.env.ci docker compose --env-file .env.ci config -q

  smoke-amd64:
    name: Build + smoke test (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Smoke test
        run: ./scripts/smoke-test.sh

  # ARM runners are only free for public repositories
  smoke-arm64:
    name: Build + smoke test (arm64)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Smoke test
        run: ./scripts/smoke-test.sh
