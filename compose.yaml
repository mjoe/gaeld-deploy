services:
  app:
    build:
      context: .
      args:
        GAELD_SOURCE: ${GAELD_SOURCE:-release}
        GAELD_VERSION: ${GAELD_VERSION:-v3.9.0}
        INSTALL_OCR: ${INSTALL_OCR:-false}
    image: ${GAELD_IMAGE:-gaeld-deploy:${GAELD_VERSION:-v3.9.0}}
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gaeld}
      POSTGRES_USER: ${DB_USERNAME:-gaeld}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is missing - run ./scripts/init.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  storage:
