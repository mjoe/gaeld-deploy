name: Release

# Release tags have the form v<upstream version>-<revision>, for example v3.9.0-1:
# the Gäld release that is built, plus a counter for changes to this repository.
# Pushing such a tag tests the image on amd64 and arm64, publishes a multi-arch image to
# ghcr.io and creates a GitHub release. A manual run is a dry run: it validates the tag and runs the tests only.
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*-[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate and test, e.g. v3.9.0-1 (dry run, nothing is published)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      upstream: ${{ steps.meta.outputs.upstream }}
      image: ${{ steps.meta.outputs.image }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the tag against the repository
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$' \
            || { echo "::error::Tag '$tag' must look like v<upstream version>-<revision>, e.g. v3.9.0-1"; exit 1; }
          upstream="${tag%-*}"
          default=$(sed -n 's/^GAELD_VERSION=//p' .env.template)
          [ "$upstream" = "$default" ] \
            || { echo "::error::Tag '$tag' names upstream $upstream, but this commit builds $default. Run scripts/bump-upstream.sh first."; exit 1; }
          ./scripts/check-versions.sh
          curl -fsIL "https://github.com/Scanix/Gaeld/releases/download/$upstream/gaeld-ce-$upstream.tar.gz.sha256" >/dev/null \
            || { echo "::error::Upstream release $upstream does not exist"; exit 1; }
          publish=false; [ "$EVENT" = "push" ] && publish=true
          {
            echo "tag=$tag"
            echo "upstream=$upstream"
            echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Smoke test (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Smoke test
        env:
          GAELD_SOURCE: release
          GAELD_VERSION: ${{ needs.prepare.outputs.upstream }}
        run: ./scripts/smoke-test.sh

  build:
    name: Build and push (${{ matrix.arch }})
    needs: [prepare, test]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            GAELD_SOURCE=release
            GAELD_VERSION=${{ needs.prepare.outputs.upstream }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch image and release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG: ${{ needs.prepare.outputs.tag }}
          UPSTREAM: ${{ needs.prepare.outputs.upstream }}
        run: |
          [ "$(find . -type f | wc -l)" -eq 2 ] || { echo "::error::Expected one digest per architecture"; find . -type f; exit 1; }
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            -t "$IMAGE:${TAG#v}" -t "$IMAGE:${UPSTREAM#v}" -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${TAG#v}"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG: ${{ needs.prepare.outputs.tag }}
          UPSTREAM: ${{ needs.prepare.outputs.upstream }}
        run: |
          cat > notes.md <<NOTES
          Docker setup for Gäld **${UPSTREAM}** (revision ${TAG##*-} of this repository).

          - Upstream release notes: https://github.com/Scanix/Gaeld/releases/tag/${UPSTREAM}
          - Image (amd64 and arm64): \`${IMAGE}:${TAG#v}\`
          - Also tagged \`${IMAGE}:${UPSTREAM#v}\` (latest revision of this upstream version) and \`${IMAGE}:latest\`
          NOTES
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --generate-notes
